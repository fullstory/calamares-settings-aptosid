# Install mode: copy the live system, or bootstrap a minimal one.
#
# The "legacy" method writes the chosen item id to globalstorage as
# packagechooser_<instance id>, i.e. packagechooser_installmode. Nothing is
# installed from here; the aptosid-bootstrap job module reads that key in the
# exec phase and either leaves the live filesystem to unpackfsc or bootstraps
# the target instead.
---
mode: required
method: legacy
default: live

labels:
    step: "Install mode"

# Each item names its own artwork, resolved against the branding component
# directory. Without one the page falls back to calamares' own "no selection"
# placeholder, which looks like a broken image. The two share a canvas and a
# background, so they read as one pair and stay the same size in the pane: a
# world full of freds for the full system, a single fred for the minimal one.
items:
  - id: live
    name: "Full"
    screenshot: "fred-world.png"
    description: "Copy the running live system to disk: the complete aptosid
        desktop, exactly as it was booted, with all of its applications. Works
        without a network connection."

  - id: minimal
    name: "Minimal"
    screenshot: "lone-fred.png"
    description: "Download and install a minimal aptosid instead: base system,
        kernel and boot loader from this medium's own package sources, but no
        desktop and no applications."
