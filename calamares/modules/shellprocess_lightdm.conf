# Clear the account expiry systemd-sysusers sets on lightdm's `u!` entry,
# so the greeter's user manager passes the PAM account check. Runs inside
# the target (dontChroot: false).
---
dontChroot: false
timeout: 30

script:
    - "if getent passwd lightdm >/dev/null; then chage -E -1 lightdm; fi"

i18n:
    name: "Unexpire the lightdm greeter account"
