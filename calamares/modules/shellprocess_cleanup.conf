# Final cleanup in the target: remove the live-session /etc/default/distro,
# which has no meaning on the installed system, and point /etc/resolv.conf
# back at systemd-resolved's stub, which networkcfg replaced with the live
# session's copy. Runs inside the target (dontChroot: false).
---
dontChroot: false
timeout: 10

script:
    - "rm -f /etc/default/distro"
    - "if [ -f /lib/systemd/system/systemd-resolved.service ]; then ln -sf ../run/systemd/resolve/stub-resolv.conf /etc/resolv.conf; fi"

i18n:
    name: "Remove live-session defaults"
