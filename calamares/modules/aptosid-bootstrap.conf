# Bootstrap a minimal aptosid into the target instead of unpacking the live
# media's readonly filesystem, when the "minimal" install mode is chosen.
#
# Writes the globalstorage flag unpackfsc reads as its "condition", so exactly
# one of the two runs; it must stay sequenced before unpackfsc, and a missing
# flag means "unpack".
---
# globalstorage key written by packagechooser@installmode, and the item id
# that selects a bootstrapped system.
modeKey: "packagechooser_installmode"
minimalItem: "minimal"

# The globalstorage flag consumed by unpackfsc's "condition".
unpackKey: "unpackfs"

# Live system deb822 source to bootstrap from: the first URIs and Suites of
# /etc/apt/sources.list.d/<bootstrapSource>.sources become mirror and suite.
bootstrapSource: "debian"

# "cdebootstrap", "debootstrap" or "mmdebstrap"; left empty, the first of
# cdebootstrap and debootstrap installed on the live system is used.
bootstrapper: ""

# Included in the bootstrap so apt can work in the target.
bootstrapInclude:
    - apt-utils
    - ca-certificates
    - gnupg
    - xz-utils
    - zstd

# Detect and install only the firmware packages this machine's hardware asks
# for. Set to false to install nothing but packages.firmware below.
detectFirmware: true

# Recommends are off: everything is named here or derived from the live
# medium (kernel metapackage, initramfs tool, boot loader, firmware).
packages:
    # Pads the bare bootstrap up to a system that boots, logs in, has a
    # network and can check its own filesystems.
    essential:
        - adduser
        - console-setup
        - dbus
        - fdisk
        - gawk
        - gdisk
        - iproute2
        - iputils-ping
        - less
        - libpam-systemd
        - linux-sysctl-defaults
        - locales
        - login
        - logrotate
        - nano
        - network-manager
        - network-manager-tui
        - nftables
        - openssh-server
        - polkitd
        - sudo
        - systemd-cron
        - systemd-resolved
        - systemd-sysv
        - systemd-timesyncd
        - tzdata
        - whiptail
        - wireless-regdb
        - wpasupplicant

    # Added when the target boots via EFI.
    efi:
        - efibootmgr

    # Per-filesystem tools, keyed by the fs names the partition module writes
    # to globalstorage (KPMcore's, so fat32 rather than vfat).
    filesystems:
        ext4:   [ e2fsprogs ]
        btrfs:  [ btrfs-progs ]
        xfs:    [ xfsprogs ]
        fat32:  [ dosfstools ]

    # Added when any target partition is encrypted; cryptsetup-initramfs is
    # appended too on initramfs-tools media.
    luks:
        - cryptsetup
        - systemd-cryptsetup

    # Firmware for hardware detectFirmware cannot see because the live
    # session never used it.
    firmware: []

    # Anything else this medium should put on a minimal target.
    extra: []
