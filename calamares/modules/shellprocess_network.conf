# Network service selection: NetworkManager owns the network when
# installed, so systemd-networkd (service and socket) must stay off to
# avoid both fighting over interfaces; enable systemd-networkd only on
# minimal systems without NetworkManager. Runs inside the target
# (dontChroot: false).
---
dontChroot: false
timeout: 30

script:
    - "if [ -f /lib/systemd/system/NetworkManager.service ]; then systemctl disable systemd-networkd.service systemd-networkd.socket; else systemctl enable systemd-networkd.service; fi"

i18n:
    name: "Select network management service"
